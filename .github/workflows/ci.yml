name: CI
on: [push, pull_request]
permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8  # Install flake8 linter
          python setup/unix-ci.py install

      - name: Run Linting (flake8) [Allow Failure]
        run: |
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true

      - name: Bootstrap calibre
        run:
          python setup/unix-ci.py bootstrap

      - name: Run Unit Tests
        env:
          PYTHONWARNINGS: error
          CALIBRE_SHOW_DEPRECATION_WARNINGS: 1
        run:
          python setup/unix-ci.py test

  archtest:
    name: Test on Arch
    runs-on: ubuntu-latest
    container:
      image: 'archlinux/archlinux:latest'
      env:
        CI: 'true'
    steps:
      - name: Setup container
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm tar

      - name: Checkout source code
        uses: actions/checkout@master
        with:
          fetch-depth: 10

      - name: Install calibre dependencies
        run: setup/arch-ci.sh

      - name: Run Linting (flake8) [Allow Failure]
        run: |
          pip install flake8
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true

      - name: Bootstrap calibre
        run: runuser -u ci -- python setup.py bootstrap --ephemeral --debug --sanitize

      - name: Run Unit Tests
        env:
          PYTHONWARNINGS: error
          CALIBRE_SHOW_DEPRECATION_WARNINGS: 1
        run: |
          set -xe
          runuser -u ci -- python setup.py test --under-sanitize
          echo "Running test_rs"
          runuser -u ci -- python setup.py test_rs
