name: CI
on: [push, pull_request]
permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  test:
    name: Run `test_build.py` only
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout source code with authentication
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Fetch full history to avoid shallow clone issues

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Run `test_build.py` only
        env:
          PYTHONWARNINGS: error
          CALIBRE_SHOW_DEPRECATION_WARNINGS: 1
        run:
          python -m unittest src.calibre.test_build